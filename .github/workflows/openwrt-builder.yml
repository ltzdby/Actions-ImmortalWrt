name: OpenWrt Builder
run-name: OpenWrt Builder - ${{ github.ref_name }}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      upload_2_release:
        type: boolean
        description: 'Upload to release'
        required: true
        default: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: diffconfig
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_2_RELEASE: ${{ inputs.upload_2_release }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        df -hT
        sudo -E apt-get purge -y --ignore-missing azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby*
        sudo -E apt-get autoremove -y --purge
        sudo rm -rf /etc/apt/sources.list.d
        sudo -E apt-get update -y
        sudo -E apt-get install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
        libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
        nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
        python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
        texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get upgrade -y
        sudo -E apt-get autoremove -y --purge
        sudo -E apt-get autoclean -y
        sudo timedatectl set-timezone "$TZ"
        df -hT

    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 4096
        swap-size-mb: 4096
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql: true
        remove-docker-images: true

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone source code
      run: |
        df -hT
        git clone $REPO_URL -b ${{ github.ref_name }} --single-branch --filter=blob:none openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        # find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) && echo "STATUS=success" >> $GITHUB_ENV || true

    - name: Retry compiling the firmware
      id: retry
      if: env.STATUS != 'success'
      run: |
        cd openwrt
        make -j1 V=s

    - name: Set build variables
      run: |
        cd openwrt
        TARGET=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/CONFIG_TARGET_(.*)DEVICE_(.*)=y/\1\2/')
        FILE_DATE=$(date -u +"%Y%m%dT%H%M%SZ")
        cd bin/targets/*/*
        VERSION="${{ github.ref_name }}_$(cat version.buildinfo)"
        echo "OUTPUT_NAME=${VERSION}_${TARGET}_${FILE_DATE}" >> $GITHUB_ENV
        echo "OUTPUT_PATH=$(echo $PWD)" >> $GITHUB_ENV

    - name: Check space usage
      run: df -hT

    - name: Upload to artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_${{ env.OUTPUT_NAME }}
        path: |
          ${{ env.OUTPUT_PATH }}
        if-no-files-found: error

    - name: Upload to release
      uses: softprops/action-gh-release@v2.0.8
      if: env.UPLOAD_2_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.OUTPUT_NAME }}
        body: ${{ env.OUTPUT_NAME }}
        files: |
          ${{ env.OUTPUT_PATH }}/*

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_2_RELEASE == 'true'
      with:
        keep_latest: 3
        delete_tag_pattern: ^${{ github.ref_name }}
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
