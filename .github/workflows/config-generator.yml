name: Config Generator

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        description: 'Branch or tag or ref'
        required: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ inputs.branch }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: diffconfig
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Switch to branch
      run: |
        git rev-parse --verify $REPO_BRANCH >/dev/null 2>&1 || (git checkout -B $REPO_BRANCH && git push -u origin $REPO_BRANCH)
        git checkout $REPO_BRANCH

    - name: Clone source code
      run: |
        git checkout -B $REPO_BRANCH
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        df -hT
        sudo -E apt-get purge -y --ignore-missing azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby*
        sudo -E apt-get autoremove -y --purge
        sudo rm -rf /etc/apt/sources.list.d
        sudo -E apt-get update -y
        sudo -E apt-get install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
        libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
        nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
        python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
        texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get upgrade -y
        sudo -E apt-get autoremove -y --purge
        sudo -E apt-get autoclean -y
        sudo timedatectl set-timezone "$TZ"
        df -hT

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3.18
      if: ${{ github.event_name == 'workflow_dispatch' }}
      with: 
        limit-access-to-actor: true

    - name: Generate diffconfig
      run: |
        cd openwrt
        ./scripts/diffconfig.sh > diffconfig
        mv diffconfig ../
        TARGET=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/CONFIG_TARGET_(.*)DEVICE_(.*)=y/\1\2/')
        FILE_DATE=$(date -u +"%Y%m%dT%H%M%SZ")
        echo "OUTPUT_NAME=${REPO_BRANCH}_${TARGET}_${FILE_DATE}" >> $GITHUB_ENV

    - name: Create pull request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch-suffix: timestamp
        base: ${{ env.REPO_BRANCH }}
        commit-message: update config ${{ env.OUTPUT_NAME }}
        title: update config ${{ env.OUTPUT_NAME }}
        add-paths: |
          diffconfig

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2.0.6
      with:
        retain_days: 0
        keep_minimum_runs: 5
        delete_workflow_pattern: "Config Generator"
