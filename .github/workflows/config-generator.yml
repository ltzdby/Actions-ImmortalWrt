name: Config Generator
run-name: Config Generator - ${{ inputs.version }} - ${{ inputs.target }}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      target:
        type: string
        description: 'Target architecture'
        required: true
        default: 'x86/64'
      version:
        type: string
        description: 'Release version'
        required: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v${{ inputs.version }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: diffconfig
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Switch to branch
      run: |
        TARGET_NAME=$(echo "${{ inputs.target }}" | sed 's/\//_/g')
        echo "TARGET_NAME=${TARGET_NAME}" >> $GITHUB_ENV
        BRANCH=v${{ inputs.version }}_${TARGET_NAME}
        echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        git fetch origin $BRANCH || (git checkout -b $BRANCH && git push -u origin $BRANCH)
        git checkout $BRANCH

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
        wget -O openwrt/.config https://downloads.immortalwrt.org/releases/${{ inputs.version }}/targets/${{ inputs.target }}/config.buildinfo

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        df -hT
        sudo -E apt-get purge -y --ignore-missing --autoremove --purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby*
        sudo rm -rf /etc/apt/sources.list.d
        sudo -E apt-get update -y
        sudo -E apt-get install -y --no-install-recommends --no-install-suggests ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
        libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
        nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
        python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
        texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get upgrade -y
        sudo -E apt-get autoremove -y --purge
        sudo -E apt-get autoclean -y
        sudo timedatectl set-timezone "$TZ"
        df -hT

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Get official kernel vermagic and .config.set
      run: |
        cd openwrt
        make defconfig
        make target/linux/compile || true
        echo "OFFICIAL_VERMAGIC=$(cat ./build_dir/target-*/linux-*/linux-*/.vermagic)" >> $GITHUB_ENV
        cp ./build_dir/target-*/linux-*/linux-*/.config.set official_config.set

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && cat $CONFIG_FILE >> openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3.18
      if: ${{ github.event_name == 'workflow_dispatch' }}
      with: 
        limit-access-to-actor: true

    - name: Check vermagic
      run: |
        cd openwrt
        make target/linux/compile || true
        NEW_VERMAGIC=$(cat ./build_dir/target-*/linux-*/linux-*/.vermagic)
        cp ./build_dir/target-*/linux-*/linux-*/.config.set new_config.set
        if [ $OFFICIAL_VERMAGIC != $NEW_VERMAGIC ]; then
          MSG="The new vermagic: $NEW_VERMAGIC does not match official vermagic: $OFFICIAL_VERMAGIC\n.config.set diff:\n"
          DIFF=$(diff --minimal official_config.set new_config.set || true)
          {
          echo "MSG<<EOF"
          echo -e "$MSG"
          echo -e "\`\`\`\n"
          echo "$DIFF"
          echo -e "\`\`\`\n"
          echo EOF
          } >> $GITHUB_ENV
          echo -e "$MSG" >> $GITHUB_STEP_SUMMARY
          echo -e "\`\`\`\n" >> $GITHUB_STEP_SUMMARY
          echo "$DIFF" >> $GITHUB_STEP_SUMMARY
          echo -e "\`\`\`\n" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Generate diffconfig
      run: |
        cd openwrt
        ./scripts/diffconfig.sh > diffconfig
        mv diffconfig ../
        FILE_DATE=$(date -u +"%Y%m%dT%H%M%SZ")
        echo "OUTPUT_NAME=${BRANCH}_${FILE_DATE}" >> $GITHUB_ENV

    - name: Upload to artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_diffconfig_${{ env.OUTPUT_NAME }}
        path: |
          diffconfig
        if-no-files-found: error

    - name: Create pull request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch-suffix: timestamp
        base: ${{ env.BRANCH }}
        commit-message: update config ${{ env.OUTPUT_NAME }}
        title: update config ${{ env.OUTPUT_NAME }}
        body: ${{ env.MSG }}
        add-paths: |
          diffconfig
